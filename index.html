<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Meghan & Nolan</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪩</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Raleway:wght@300;400;500;600&family=Sacramento&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Georgia', serif;
      background: #000; /* Black to match video during password phase */
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow: hidden;
    }
    
    
    /* Video background - fixed overlay that fades out */
    .video-background {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 100;
      overflow: hidden;
      opacity: 1;
      /* ease-in: slow start, fast end */
      transition: opacity 1.5s ease-in;
      pointer-events: none;
    }
    
    .video-background video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
    }
    
    /* Dark overlay removed for brighter video */
    .video-background::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0);
      pointer-events: none;
    }
    
    /* Fallback gradient if video doesn't load */
    body.no-video {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    /* Fade out video when content is visible */
    body.content-visible .video-background {
      opacity: 0;
      pointer-events: none;
    }
    
    .container {
      /* Container just holds password page and main content */
    }
    
    .password-page {
      position: fixed;
      top: calc(58vh - 50px); /* Same position as before */
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 200;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      transition: opacity 0.5s ease-out;
    }
    
    .password-page.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    
    .password-page h1 {
      color: #fff;
      margin-bottom: 20px;
      font-size: 2.5em;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }
    
    .password-page p {
      color: #fff;
      margin-bottom: 30px;
      font-size: 1.1em;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
    }
    
    .password-input {
      width: 100%;
      max-width: 300px;
      padding: 15px 20px;
      font-size: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      border: 1px solid rgba(200, 200, 200, 0.9);
      border-radius: 10px;
      transition: border-color 0.3s, color 0.3s;
      margin: 0;
      height: 50px;
      background: transparent;
      color: rgba(180, 180, 180, 0.95);
      text-align: center;
    }
    
    .password-input::placeholder {
      color: rgba(200, 200, 200, 0.85);
      font-style: italic;
      text-align: center;
    }
    
    .password-input:focus {
      outline: none;
      border-color: rgba(68, 68, 68, 0.8);
    }
    
    .password-input-container {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      position: relative;
    }
    
    /* Ensure input stays visible on mobile when keyboard opens */
    .password-input.granted {
      color: #4ade80;
      border-color: #4ade80;
    }
    
    .btn {
      background: rgba(68, 68, 68, 0.7);
      color: white;
      border: none;
      padding: 0;
      font-size: 24px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
      font-weight: bold;
      width: 50px;
      height: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      line-height: 1;
      backdrop-filter: blur(10px);
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(68, 68, 68, 0.4);
      background: rgba(68, 68, 68, 0.85);
    }
    
    .btn:active {
      transform: translateY(0);
    }
    
    .error-message {
      color: #ff6b6b;
      margin-top: 15px;
      font-size: 14px;
      min-height: 20px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
      font-weight: 500;
    }
    
    /* ========== MAIN CONTENT STYLES ========== */
    /* Main content sits behind video/password, already in position */
    .main-content {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #faf9f7;
      font-family: 'Raleway', sans-serif;
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 50;
    }
    
    /* When shown - just display it, no animation */
    .main-content.shown {
      display: block;
    }
    
    /* Mobile: flex container for title bar + scroll area */
    @media (max-width: 768px) {
      .main-content.shown {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
    }
    
    /* Site Header */
    .site-header {
      text-align: center;
      padding: 40px 20px 20px;
      background: #faf9f7;
    }
    
    .site-title {
      font-family: 'Bodoni Moda', serif;
      font-size: 4em;
      font-weight: 400;
      color: #1a1a1a;
      letter-spacing: 2px;
      margin-bottom: 15px;
    }
    
    .site-title .ampersand {
      font-style: normal;
    }
    
    .site-date {
      font-family: 'Raleway', sans-serif;
      font-size: 1.1em;
      font-weight: 400;
      color: #333;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    
    .site-date-mobile {
      display: none;
    }
    
    @media (max-width: 768px) {
      .site-date {
        display: none;
      }
      
      .site-date-mobile {
        display: block;
        font-family: 'Raleway', sans-serif;
        font-size: 1em;
        font-weight: 400;
        color: #333;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-align: center;
      }
      
      .site-date-mobile .date-line,
      .site-date-mobile .location-line {
        display: block;
      }
      
      .site-date-mobile .date-divider {
        display: block;
        width: 40px;
        height: 2px;
        background: #f3722b;
        margin: 12px auto;
      }
    }
    
    /* Hide mobile elements on desktop */
    .mobile-top-bar,
    .mobile-menu,
    .mobile-scroll-container {
      display: none;
    }
    
    /* Desktop Navigation */
    .site-nav {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 20px;
      background: #faf9f7;
    }
    
    .site-nav a {
      font-family: 'Raleway', sans-serif;
      font-size: 0.95em;
      font-weight: 400;
      color: #333;
      text-decoration: none;
      letter-spacing: 1px;
      padding: 5px 0;
      border-bottom: 1px solid transparent;
      transition: border-color 0.3s;
    }
    
    .site-nav a:hover,
    .site-nav a.active {
      border-bottom: 2px solid #f3722b;
    }
    
    .site-nav a.active {
      font-weight: 600;
    }
    
    /* Mobile top bar - flex item with fixed size */
    .mobile-top-bar {
      display: none;
      width: 100%;
      height: 60px;
      min-height: 60px;
      max-height: 60px; /* Prevent growing */
      flex-shrink: 0; /* Prevent shrinking */
      flex-grow: 0; /* Prevent growing */
      background: #faf9f7;
      z-index: 1001;
      border-bottom: 1px solid #eee;
      touch-action: manipulation;
      position: relative;
    }
    
    /* Mobile countdown bar */
    .mobile-countdown {
      display: none;
      width: 100%;
      padding: 5px 20px;
      background: #faf9f7;
      border-bottom: 1px solid #eee;
      align-items: center;
      justify-content: space-around;
      font-family: 'Raleway', sans-serif;
      font-size: 0.9em;
      color: #333;
    }
    
    .countdown-label-left {
      font-family: 'Bodoni Moda', serif;
      font-size: 1.5em;
      font-weight: 400;
      letter-spacing: 1px;
      color: #333;
    }
    
    .countdown-timer {
      display: flex;
      gap: 12px;
    }
    
    .countdown-unit {
      text-align: center;
    }
    
    .countdown-number {
      font-family: 'Bodoni Moda', serif;
      font-size: 1.4em;
      font-weight: 600;
      color: #f3722b;
      display: block;
      font-variant-numeric: tabular-nums;
    }
    
    .countdown-label {
      font-size: 0.75em;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #666;
    }
    
    /* Mobile hero photo */
    .mobile-hero-photo {
      display: none;
      width: 100%;
      overflow: hidden;
    }
    
    .mobile-hero-photo img {
      width: 100%;
      height: auto;
      display: block;
      filter: brightness(1.1);
    }
    
    .mobile-top-bar-title {
      position: absolute;
      top: 58%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Sacramento', cursive;
      font-size: 2em;
      font-weight: 400;
      letter-spacing: 1px;
      color: #333;
    }
    
    /* Desktop scroll container - full page scrollable */
    .desktop-scroll-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow-y: auto;
      overflow-x: hidden;
      background: #faf9f7;
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* IE/Edge */
    }
    
    .desktop-scroll-container::-webkit-scrollbar {
      display: none; /* Chrome/Safari/Opera */
    }
    
    /* Mobile scroll container */
    .mobile-scroll-container {
      display: none;
      background: #faf9f7;
    }
    
    /* Mobile hamburger button */
    .hamburger {
      display: none;
      position: absolute;
      top: 50%;
      left: 15px;
      transform: translateY(-50%);
      z-index: 1002;
      background: none;
      border: none;
      cursor: pointer;
      padding: 10px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Large clickable area for hamburger menu */
    .hamburger-click-area {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 25%;
      height: 100%;
      z-index: 1001;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    
    .hamburger span {
      display: block;
      width: 25px;
      height: 2px;
      background: #333;
      margin: 5px 0;
      transition: all 0.3s;
    }
    
    .hamburger.active span:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }
    
    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }
    
    .hamburger.active span:nth-child(3) {
      transform: rotate(-45deg) translate(5px, -5px);
    }
    
    /* Mobile menu overlay */
    .mobile-menu {
      display: none;
      position: fixed;
      top: 60px;
      left: 0;
      width: 100%;
      height: calc(100% - 60px);
      background: #faf9f7;
      z-index: 1000;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
    }
    
    .mobile-menu.active {
      opacity: 1;
      visibility: visible;
    }
    
    /* Icon scroller in mobile menu */
    .menu-icon-scroller {
      position: absolute;
      bottom: 5vh;
      left: 0;
      width: 100%;
      overflow: hidden;
      padding: 20px 0;
    }
    
    .menu-icon-scroller-top {
      position: absolute;
      top: 4vh;
      left: 0;
      width: 100%;
      overflow: hidden;
      padding: 20px 0;
    }
    
    .icon-track {
      display: flex;
      animation: scroll-icons 20s linear infinite;
      width: fit-content;
    }
    
    .icon-track-reverse {
      display: flex;
      animation: scroll-icons-reverse 20s linear infinite;
      width: fit-content;
    }
    
    .icon-track img,
    .icon-track-reverse img {
      height: 40px;
      width: 40px;
      margin: 0 25px;
      display: inline-block;
      filter: brightness(0) saturate(100%) invert(48%) sepia(85%) saturate(1703%) hue-rotate(347deg) brightness(98%) contrast(93%);
    }
    
    @keyframes scroll-icons-reverse {
      0% {
        transform: translateX(-50%);
      }
      100% {
        transform: translateX(0);
      }
    }
    
    @keyframes scroll-icons {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-50%);
      }
    }
    
    .mobile-menu-header {
      text-align: center;
      margin-bottom: 40px;
    }
    
    .mobile-menu-title {
      font-family: 'Raleway', sans-serif;
      font-size: 0.9em;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #333;
      margin-bottom: 30px;
    }
    
    .mobile-menu-couple {
      font-family: 'Bodoni Moda', serif;
      font-size: 2.5em;
      font-weight: 400;
      color: #1a1a1a;
      line-height: 1.3;
    }
    
    .mobile-menu-couple .ampersand {
      font-style: normal;
    }
    
    .mobile-menu-date {
      font-family: 'Raleway', sans-serif;
      font-size: 0.85em;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #333;
      margin-top: 15px;
    }
    
    .mobile-menu nav {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      position: relative;
      padding: 80px 0;
    }
    
    .mobile-menu nav a {
      font-family: 'Raleway', sans-serif;
      font-size: 1.1em;
      font-weight: 400;
      color: #333;
      text-decoration: none;
      letter-spacing: 1px;
    }
    
    .mobile-menu nav a.active {
      border-bottom: 2px solid #f3722b;
      padding-bottom: 2px;
      font-weight: 600;
    }
    
    /* Page sections */
    .page-section {
      display: none;
      padding: 0 20px 60px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .page-section.active {
      display: block;
    }
    
    /* Mobile: sections container and page sections fill available height */
    @media (max-width: 768px) {
      .mobile-sections {
        height: 100%;
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }
      
      .mobile-scroll-container .page-section {
        height: 100%;
      }
      
      .mobile-scroll-container .page-section.active {
        height: 100%;
        flex: 1;
      }
    }
    
    .page-section h2 {
      font-family: 'Bodoni Moda', serif;
      font-size: 2.5em;
      font-weight: 400;
      color: #1a1a1a;
      text-align: center;
      margin-bottom: 40px;
    }
    
    .page-section p {
      font-family: 'Raleway', sans-serif;
      font-size: 1.1em;
      line-height: 1.8;
      color: #444;
      max-width: 800px;
      margin: 0 auto 20px;
    }
    
    /* Events list styling */
    .events-list {
      max-width: 750px;
      margin: 0 auto;
    }
    
    .home-hero-image {
      max-width: 750px;
      width: 100%;
      max-height: 420px;
      margin: 0 auto 20px;
      display: block;
      border-radius: 8px;
      object-fit: cover;
      object-position: center bottom;
      filter: brightness(1.1);
    }
    
    .event-item {
      background: #fafafa;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 40px;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .event-title {
      font-family: 'Bodoni Moda', serif;
      font-size: 2em;
      font-weight: 600;
      letter-spacing: 2px;
      color: #1a1a1a;
      margin-bottom: 15px;
      text-transform: uppercase;
    }
    
    .event-date {
      font-family: 'Raleway', sans-serif;
      font-size: 1.1em;
      color: #555;
      margin-bottom: 8px;
    }
    
    .event-time {
      font-family: 'Raleway', sans-serif;
      font-size: 1.3em;
      color: #333;
      margin-bottom: 20px;
      font-weight: 500;
    }
    
    .event-after-party {
      font-family: 'Raleway', sans-serif;
      font-size: 1em;
      color: #555;
      margin-top: 15px;
      margin-bottom: 5px;
    }
    
    .event-after-party-time {
      font-family: 'Raleway', sans-serif;
      font-size: 1.3em;
      color: #333;
      margin-bottom: 20px;
      font-weight: 500;
    }
    
    .event-venue {
      font-family: 'Raleway', sans-serif;
      font-size: 1em;
      color: #444;
      margin-bottom: 5px;
    }
    
    .event-location {
      font-family: 'Raleway', sans-serif;
      font-size: 0.95em;
      color: #666;
      margin-bottom: 20px;
    }
    
    .event-attire-label {
      font-family: 'Raleway', sans-serif;
      font-size: 0.9em;
      color: #666;
      margin-bottom: 5px;
    }
    
    .event-attire {
      font-family: 'Raleway', sans-serif;
      font-size: 1em;
      color: #333;
    }
    
    /* Photo grid */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 40px;
    }
    
    .photo-grid img {
      width: 100%;
      height: 300px;
      object-fit: cover;
    }
    
    /* Photos Coming Soon styles */
    .photos-coming-soon {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      padding: 20px;
    }
    
    .photos-coming-soon-wrapper {
      position: relative;
      display: inline-block;
      max-width: 100%;
    }
    
    .photos-coming-soon-wrapper img {
      display: block;
      max-width: 100%;
      max-height: 70vh;
      width: auto;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
    }
    
    .coming-soon-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-5deg);
      background: white;
      padding: 15px 40px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      white-space: nowrap;
      border-radius: 10px;
    }
    
    .coming-soon-banner span {
      font-family: 'Sacramento', cursive;
      font-size: 3em;
      color: #f3722b;
      display: block;
      text-align: center;
    }
    
    /* Mobile: Photos page fills available space */
    @media (max-width: 768px) {
      .photos-page-active .mobile-scroll-container .site-header {
        display: none;
      }
      
      .photos-page-active .mobile-scroll-container {
        display: flex !important;
        flex-direction: column;
        height: 100%;
      }
      
      .photos-page-active #section-photos {
        flex: 1;
        display: flex !important;
        min-height: 0;
      }
      
      .photos-page-active .photos-coming-soon {
        flex: 1;
        width: 100%;
        min-height: 0;
        padding: 15px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .coming-soon-banner {
        padding: 10px 25px;
      }
      
      .coming-soon-banner span {
        font-size: 2em;
      }
    }
    
    /* Registry Coming Soon styles */
    .registry-coming-soon {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 50vh;
      padding: 40px 20px;
    }
    
    .registry-circle {
      position: relative;
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .registry-text {
      text-align: center;
      z-index: 1;
    }
    
    .registry-text span {
      font-family: 'Sacramento', cursive;
      font-size: 3.5em;
      color: #1a1a1a;
      display: block;
      line-height: 1.1;
    }
    
    .registry-text span:first-child {
      padding-top: 10px;
    }
    
    .registry-icons-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      animation: registry-spin 20s linear infinite;
    }
    
    @keyframes registry-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    @keyframes registry-counter-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    
    .registry-icon-wrapper {
      position: absolute;
      width: 36px;
      height: 36px;
      top: 50%;
      left: 50%;
      margin-left: -18px;
      margin-top: -18px;
    }
    
    .registry-icon-wrapper:nth-child(1) { transform: rotate(0deg) translateY(-120px); }
    .registry-icon-wrapper:nth-child(2) { transform: rotate(45deg) translateY(-120px); }
    .registry-icon-wrapper:nth-child(3) { transform: rotate(90deg) translateY(-120px); }
    .registry-icon-wrapper:nth-child(4) { transform: rotate(135deg) translateY(-120px); }
    .registry-icon-wrapper:nth-child(5) { transform: rotate(180deg) translateY(-120px); }
    .registry-icon-wrapper:nth-child(6) { transform: rotate(225deg) translateY(-120px); }
    .registry-icon-wrapper:nth-child(7) { transform: rotate(270deg) translateY(-120px); }
    .registry-icon-wrapper:nth-child(8) { transform: rotate(315deg) translateY(-120px); }
    
    .registry-icon {
      width: 100%;

54908e534ce4315d7f5c257feff5efb2470fbe420726a00cf1ff87a92173a01d5158f790a4bf713eec3b67b515afc310a393b53805d91970d1c88b5f818ea4b49fb40683816aed18d7cb71348e0470393ff2fc4a708e595a0088528e4"}';
    
    // Decrypt function using Web Crypto API
    async function decryptContent(password, encryptedPayload) {
      try {
        const { salt, iv, authTag, content } = JSON.parse(encryptedPayload);
        
        // Convert hex strings back to bytes
        const saltBytes = hexToBytes(salt);
        const ivBytes = hexToBytes(iv);
        const authTagBytes = hexToBytes(authTag);
        const contentBytes = hexToBytes(content);
        
        // Derive key from password using PBKDF2
        const enc = new TextEncoder();
        const passwordKey = await crypto.subtle.importKey(
          'raw',
          enc.encode(password),
          'PBKDF2',
          false,
          ['deriveBits']
        );
        
        const derivedBits = await crypto.subtle.deriveBits(
          {
            name: 'PBKDF2',
            salt: saltBytes,
            iterations: 100000,
            hash: 'SHA-256'
          },
          passwordKey,
          256
        );
        
        const key = await crypto.subtle.importKey(
          'raw',
          derivedBits,
          'AES-GCM',
          false,
          ['decrypt']
        );
        
        // Combine content and auth tag for GCM
        const combined = new Uint8Array(contentBytes.length + authTagBytes.length);
        combined.set(contentBytes);
        combined.set(authTagBytes, contentBytes.length);
        
        // Decrypt
        const decrypted = await crypto.subtle.decrypt(
          {
            name: 'AES-GCM',
            iv: ivBytes,
            tagLength: 128
          },
          key,
          combined
        );
        
        const dec = new TextDecoder();
        return dec.decode(decrypted);
      } catch (error) {
        return null;
      }
    }
    
    function hexToBytes(hex) {
      const bytes = new Uint8Array(hex.length / 2);
      for (let i = 0; i < hex.length; i += 2) {
        bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
      }
      return bytes;
    }
    
    // Debounce timer for auto-checking password as user types
    let passwordCheckTimer = null;
    
    async function checkPasswordAsYouType() {
      const errorMsg = document.getElementById('errorMessage');
      errorMsg.textContent = ''; // Clear error message while typing
      
      // Clear previous timer
      if (passwordCheckTimer) {
        clearTimeout(passwordCheckTimer);
      }
      
      // Wait 300ms after user stops typing before checking
      passwordCheckTimer = setTimeout(async () => {
        await checkPassword();
      }, 300);
    }
    
    async function checkPassword() {
      const passwordInput = document.getElementById('passwordInput');
      const password = passwordInput.value.toLowerCase();
      const errorMsg = document.getElementById('errorMessage');
      
      // Don't check if input is disabled (already granted access)
      if (passwordInput.disabled) {
        return;
      }
      
      if (!password) {
        return;
      }
      
      const decryptedContent = await decryptContent(password, ENCRYPTED_DATA);
      
      if (decryptedContent) {
        // Success! Show "Welcome!" in green
        const passwordInput = document.getElementById('passwordInput');
        passwordInput.type = 'text';
        passwordInput.value = 'Welcome!';
        passwordInput.classList.add('granted');
        passwordInput.disabled = true;
        
        // Close keyboard and scroll back to top first
        passwordInput.blur();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        
        // Wait for keyboard to close and scroll to complete, then fade
        setTimeout(async () => {
          try {
            const data = JSON.parse(decryptedContent);
            displayContent(data);
            
            // Load correct section based on current URL or redirect from 404
            let path = sessionStorage.getItem('redirect');
            if (path) {
              sessionStorage.removeItem('redirect');
            } else {
              path = window.location.pathname;
            }
            // Extract section ID from path (handle both /photos and /wedding/photos)
            const pathParts = path.split('/').filter(p => p);
            // Filter out 'wedding' base path if present
            const filteredParts = pathParts.filter(p => p !== 'wedding');
            const sectionId = filteredParts.length === 0 ? 'home' : filteredParts[filteredParts.length - 1];
            // Always show the appropriate section (including home)
            if (sectionId !== 'home') {
              showSectionFromUrl(sectionId);
            }
            // Home section is already active by default in the HTML
            
            // Show main content immediately (it's behind video, will be revealed as video fades)
            const mainContent = document.getElementById('mainContent');
            mainContent.classList.add('shown');
            
            // Fade out password box
            document.getElementById('passwordPage').classList.add('hidden');
            
            // Fade out video (content is already visible behind it)
            document.body.classList.add('content-visible');
            
            // Forward touch events from video to scroll container during fade
            const videoBackground = document.querySelector('.video-background');
            const scrollContainer = document.querySelector('.mobile-scroll-container');
            if (videoBackground && scrollContainer) {
              // Allow touch events to reach content by making video non-interactive
              videoBackground.style.pointerEvents = 'none';
              
              // For iOS: also forward touch events manually
              const forwardTouch = (e) => {
                const touch = e.touches[0];
                const target = document.elementFromPoint(touch.clientX, touch.clientY);
                if (target && target !== videoBackground) {
                  // Event will naturally go to the element below since pointer-events: none
                }
              };
              videoBackground.addEventListener('touchstart', forwardTouch, { passive: true });
              videoBackground.addEventListener('touchmove', forwardTouch, { passive: true });
            }
            
            // Remove video from DOM at 1.5s (ease-in means it's mostly faded by then)
            setTimeout(() => {
              if (videoBackground) {
                videoBackground.remove();
              }
            }, 1500);
            
            // Store success in session (not password)
            sessionStorage.setItem('authenticated', 'true');
          } catch (error) {
            console.error('Error loading content:', error);
            errorMsg.textContent = 'Error loading content: ' + error.message;

            document.getElementById('passwordInput').value = '';
            errorMsg.textContent = '';
            document.getElementById('passwordInput').focus();
          }, 1500);
        }
      }

    // Countdown timer to December 31, 2026 at midnight ET
    function startCountdown() {
      function updateCountdown() {
        // Target date: December 31, 2026, 00:00:00 ET (UTC-5)
        const targetDate = new Date('2026-12-31T00:00:00-05:00');
        const now = new Date();
        const diff = targetDate - now;
        
        if (diff <= 0) {
          // Event has passed
          document.getElementById('days').textContent = '000';
          document.getElementById('hours').textContent = '00';
          document.getElementById('minutes').textContent = '00';
          document.getElementById('seconds').textContent = '00';
          return;
        }
        
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);
        
        document.getElementById('days').textContent = String(days).padStart(3, '0');
        document.getElementById('hours').textContent = String(hours).padStart(2, '0');
        document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
        document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
      }
      
      // Update immediately and then every second
      updateCountdown();
      setInterval(updateCountdown, 1000);
    }
    
    // Get base path (e.g., '/wedding' for GitHub Pages or '' for root domain)
    function getBasePath() {
      const path = window.location.pathname;
      const parts = path.split('/').filter(p => p);
      // If first part is 'wedding' (repo name), use it as base
      if (parts.length > 0 && parts[0] === 'wedding') {
        return '/wedding';
      }
      return '';
    }
    
    function toggleMobileMenu() {

    function toggleQA(element) {

    }
    
    // Bouncing question mark screensaver
    let bouncerX = 100, bouncerY = 100;
    let bouncerDX = 1.2, bouncerDY = 0.9;
    let bouncerAnimationId = null;
    
    function animateBouncer() {
      const bouncer = document.getElementById('qaBouncer');
      
      if (!bouncer) {
        bouncerAnimationId = requestAnimationFrame(animateBouncer);
        return;
      }
      
      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;
      const bouncerWidth = 60;
      const bouncerHeight = 60;
      
      bouncerX += bouncerDX;
      bouncerY += bouncerDY;
      
      // Bounce off edges - use screen dimensions
      if (bouncerX <= 0) {
        bouncerDX = Math.abs(bouncerDX);
        bouncerX = 0;
      } else if (bouncerX + bouncerWidth >= screenWidth) {
        bouncerDX = -Math.abs(bouncerDX);
        bouncerX = screenWidth - bouncerWidth;
      }
      
      if (bouncerY <= 0) {
        bouncerDY = Math.abs(bouncerDY);
        bouncerY = 0;
      } else if (bouncerY + bouncerHeight >= screenHeight) {
        bouncerDY = -Math.abs(bouncerDY);
        bouncerY = screenHeight - bouncerHeight;
      }
      
      bouncer.style.left = bouncerX + 'px';
      bouncer.style.top = bouncerY + 'px';
      
      bouncerAnimationId = requestAnimationFrame(animateBouncer);
    }
    
    // Start bouncer when Q+A section is shown
    function startBouncer() {
      if (!bouncerAnimationId) {
        // Reset position to center-ish
        bouncerX = window.innerWidth / 3;
        bouncerY = window.innerHeight / 3;
        bouncerAnimationId = requestAnimationFrame(animateBouncer);
      }
    }
    
    function stopBouncer() {
      if (bouncerAnimationId) {
        cancelAnimationFrame(bouncerAnimationId);
        bouncerAnimationId = null;
      }
    }

      if (menu) menu.classList.remove('active');
      if (hamburger) hamburger.classList.remove('active');
      
      return false;
    }
